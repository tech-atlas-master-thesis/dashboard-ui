<div class="h-full w-full bg-white rounded-3xl p-5 flex flex-col gap-2">
  @if (service.data.isLoading()) {
    <div class="flex-1 flex items-center justify-center">
      <div
        class="w-10 h-10 border-4 border-gray-200 border-t-black rounded-full animate-spin"
      ></div>
    </div>
  } @else if (technology()) {
    <div class="flex items-center gap-4 shrink-0 pl-3 h-2">
      <button (click)="goBack()" class="text-gray-400 hover:text-gray-600 text-sm cursor-pointer">
        ← Zurück
      </button>
      <div class="w-px h-5 bg-gray-300"></div>
      <p
        class="text-xs font-medium px-2 py-1 rounded-full text-white"
        [style.background]="field()!.style.color"
      >
        {{ field()!.label }} → {{ technology()!.label }}
      </p>
    </div>

    <div class="flex-1 min-h-0 relative">
      <app-network
        [filterByTechnology]="technology()!._id.$oid"
        [filters]="filters()"
        (nodeSelected)="onNodeSelected($event)"
        (projectSelected)="onProjectSelected($event)"
      >
      </app-network>

      <div class="absolute top-3 right-3 z-10">
        <app-network-filter
          [data]="networkService.data.value() ?? null"
          [filters]="filters()"
          (filtersChange)="filters.set($event)"
        ></app-network-filter>
      </div>

      @if (selectedOrganisation()) {
        <div class="absolute bottom-3 z-10 w-full">
          <app-organisation-detail
            [organisation]="selectedOrganisation()!.organisation"
            [projectCount]="selectedOrganisation()!.projectCount"
            [cooperationCount]="selectedOrganisation()!.cooperationCount"
            (closed)="closePanels()"
          >
          </app-organisation-detail>
        </div>
      }

      @if (selectedProject()) {
        <div class="absolute bottom-3 z-10 w-full">
          <app-project-detail
            [selection]="selectedProject()!"
            (closed)="closePanels()"
          ></app-project-detail>
        </div>
      }
    </div>
  } @else {
    <div class="flex-1 flex items-center justify-center text-gray-400">
      Technologie nicht gefunden.
    </div>
  }
</div>
