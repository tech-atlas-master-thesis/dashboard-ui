<div class="flex h-full w-full flex-col gap-3 bg-white px-10 py-3">
  @if (service.data.isLoading()) {
    <div class="flex flex-1 items-center justify-center">
      <app-spinner size="lg" />
    </div>
  } @else if (technology()) {
    <app-page-head [label]="field()!.label + ' → ' + technology()!.label" [color]="field()!.style.color" (back)="nav.goBack()">
      <app-network-filter
        [data]="networkService.data.value() ?? null"
        [filters]="filters()"
        (filtersChange)="filters.set($event)"
        (selectRequested)="selectRequest.set($event)"
      ></app-network-filter>
    </app-page-head>

    <div class="relative min-h-0 flex-1">
      <app-network
        [filterByTechnology]="technology()!._id.$oid"
        [filters]="filters()"
        (nodeSelected)="onNodeSelected($event)"
        (projectSelected)="onProjectSelected($event)"
        [selectNode]="selectRequest()"
      >
      </app-network>

      @if (selectedOrganisation()) {
        <div class="absolute inset-x-0 bottom-3 z-10 px-3">
          <app-organisation-preview
            [organisation]="selectedOrganisation()!.organisation"
            [projectCount]="selectedOrganisation()!.projectCount"
            [cooperationCount]="selectedOrganisation()!.cooperationCount"
            (detailsRequested)="openOrganisation($event)"
            (closed)="closePanels()"
          >
          </app-organisation-preview>
        </div>
      }

      @if (selectedProject()) {
        <div class="absolute inset-x-0 bottom-3 z-10 px-3">
          <app-project-preview [selection]="selectedProject()!" (detailsRequested)="openProject($event)" (closed)="closePanels()"></app-project-preview>
        </div>
      }
    </div>
  } @else {
    <div class="flex flex-1 items-center justify-center text-gray-400">Technologie nicht gefunden.</div>
  }
</div>
