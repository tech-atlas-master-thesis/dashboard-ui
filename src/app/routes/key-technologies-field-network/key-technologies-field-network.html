<div class="h-full w-full bg-white rounded-3xl p-10 flex flex-col gap-6">
  @if (keyTechnologyService.data.isLoading()) {
    <div class="flex-1 flex flex-col items-center justify-center gap-4">
      <div
        class="w-10 h-10 border-4 border-gray-200 border-t-black rounded-full animate-spin"
      ></div>
      <span class="text-gray-400 font-light text-sm">Wird geladen…</span>
    </div>
  } @else {
    <div class="flex items-center gap-4 shrink-0 h-8 pl-3">
      @if (selectedField()) {
        <button
          (click)="backToFields()"
          class="text-gray-400 hover:text-gray-600 text-sm cursor-pointer"
        >
          ← Zurück
        </button>

        <div class="w-px h-5 bg-gray-200"></div>
        <span
          class="text-xs font-medium px-2 py-1 rounded-full text-white"
          [style.background]="selectedField()!.style.accent"
        >
          {{ selectedField()!.label }}
        </span>
      } @else {
        <h1 class="text-2xl font-extralight">Schlüsseltechnologiefelder</h1>
      }
    </div>

    @if (selectedField()) {
      <div class="flex-1 min-h-0 rounded-2xl overflow-hidden">
        <app-basic-network [filterByField]="selectedField()!._id.$oid"> </app-basic-network>
      </div>
    } @else {
      <div id="key-technologies-network" class="flex-1 min-h-0 w-full"></div>
    }
  }
</div>
